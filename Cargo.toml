[package]
name = "crosshair"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Standalone click-through crosshair overlay for Linux"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_10"] }
gtk4-layer-shell = "0.8.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
x11rb = { version = "0.14.0", features = ["xfixes"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
